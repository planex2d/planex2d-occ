# planex2d-occ's releases: every day it looks for new netgen-mesher releases on PyPI and builds two kinds of release,
# each when it lacks a module:
# - the main release, for netgen's newest real releases (post releases included);
# - the pre-release, for netgen's nightlies (such as 6.2.2608.post63.dev0) newer than its newest real release, with a
#   version pip takes only with --pre (0.2.4.2.dev1 after 0.2.4.1).
# Each builds the new modules for every platform and Python, tests the wheels with the current planex2d from the index
# (its sdist's tests), publishes them and makes the tag and the GitHub release. Run by hand after a planex2d release
# with rebuild=true: every module anew for that planex2d.
#
# planex2d is read from PyPI and planex2d-occ is released there.
#
# Once: a trusted publisher on pypi.org for this repository, workflow release.yml, environment "pypi" (a pending
# publisher until the project planex2d-occ exists), and the environment "pypi" in this repository's settings (no
# required reviewer: the releases are automatic).
name: release

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      planex2d:
        description: "the planex2d version to build for, a pre-release too (empty: the newest final release)"
        required: false
        default: ""
      rebuild:
        description: "build every module anew (after a planex2d release)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # the index planex2d is read from and planex2d-occ is released to
  INDEX: https://pypi.org
  INDEX_SIMPLE: https://pypi.org/simple/
  WINDOW: "6"
  # the oldest netgen planex's OCC bindings build against: 6.2.2603 and 6.2.2604 have another netgen::Identify
  MIN_NETGEN: "6.2.2605"
  # the oldest planex2d a scheduled run builds for (the first with planex2d-occ); a run by hand takes any planex2d,
  # pre-releases too
  MIN_PLANEX2D: "0.2.0"
  # the oldest planex2d the pre-release is built for: netgen's nightlies use OpenCASCADE 8, which planex's OCC
  # bindings compile with from 0.3.0 on
  MIN_PLANEX2D_PRE: "0.3.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      planex2d: ${{ steps.plan.outputs.planex2d }}
      plans: ${{ steps.plan.outputs.plans }}
      kinds: ${{ steps.plan.outputs.kinds }}
      each: ${{ steps.plan.outputs.each }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - id: plan
        run: |
          args="--window $WINDOW --min-netgen $MIN_NETGEN --min-planex2d $MIN_PLANEX2D --min-planex2d-pre $MIN_PLANEX2D_PRE --index $INDEX"
          [ -n "${{ inputs.planex2d }}" ] && args="$args --planex2d ${{ inputs.planex2d }}"
          [ "${{ inputs.rebuild }}" = "true" ] && args="$args --rebuild"
          python tools/plan.py $args > plan.json
          cat plan.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("plan.json"))
          kinds = [k for k in ("main", "pre") if p[k]["release"]]
          plans = {k: {key: " ".join(value) if isinstance(value, list) else value or "" for key, value in p[k].items()}
                   for k in ("main", "pre")}
          print(f"planex2d={p['planex2d']}")
          print(f"plans={json.dumps(plans)}")
          print(f"kinds={json.dumps(kinds)}")
          print(f"each={json.dumps([{'kind': k, 'netgen': v} for k in kinds for v in p[k]['build']])}")
          print(f"release={'true' if kinds else 'false'}")
          EOF
      # planex2d's sdist, once for every job, as the index's file: pip download would prepare its metadata and so
      # install its build requirements
      - name: planex2d's sdist
        if: steps.plan.outputs.release == 'true'
        run: python tools/sdist.py "${{ steps.plan.outputs.planex2d }}" "$INDEX_SIMPLE" core-sdist
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.release == 'true'
        with:
          name: core-sdist
          path: core-sdist/*.tar.gz

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
        os: [linux, macos-arm64, macos-x86_64, windows]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os == 'macos-arm64' && 'macos-15' || matrix.os == 'macos-x86_64' && 'macos-15-intel' || 'windows-latest' }}
    env:
      # planex writes numbers with std::to_chars, which Apple's C++ library has from macOS 13.3 on; the macOS 15
      # runners' Xcode 16 builds plain structs from parentheses (C++20), Xcode 15 does not
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      VERSION: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].version }}
      BUILD: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].build }}
      KEEP: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].keep }}
      PREVIOUS: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].previous }}
      WINDOW_VERSIONS: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].window }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: core-sdist
      - uses: actions/setup-python@v5
        if: matrix.os != 'linux'
        with:
          python-version: ${{ matrix.python }}
      # an artifact can arrive cut off: the sdist checked against the index's sha256, fetched again if it differs
      - name: planex2d's sdist checked
        shell: bash
        run: ${{ matrix.os == 'linux' && 'python3' || 'python' }} tools/sdist.py "${{ needs.plan.outputs.planex2d }}" "$INDEX_SIMPLE" core-sdist
      - name: Build (Linux, in the manylinux_2_28 image netgen's wheels are built for)
        if: matrix.os == 'linux'
        run: |
          export SDIST=$(ls core-sdist/*.tar.gz)
          docker run --rm -v "$PWD":/io -w /io -e INDEX_SIMPLE -e SDIST -e VERSION -e BUILD -e KEEP -e PREVIOUS -e WINDOW_VERSIONS \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            py=/opt/python/cp$(echo ${{ matrix.python }} | tr -d .)-cp$(echo ${{ matrix.python }} | tr -d .)/bin/python
            $py -m pip install -q packaging scikit-build-core auditwheel
            sh tools/build_wheel.sh "$py" "${{ needs.plan.outputs.planex2d }}" "$VERSION" "$BUILD" "$KEEP" "$PREVIOUS" "$WINDOW_VERSIONS"
            $py -m auditwheel repair -w wheelhouse --exclude "libnglib.so" --exclude "libngcore.so" --exclude "libTK*" dist/*.whl
          '
      - name: Build (macOS, Windows)
        if: matrix.os != 'linux'
        shell: bash
        run: |
          python -m pip install -q packaging scikit-build-core
          export SDIST=$(ls core-sdist/*.tar.gz)
          sh tools/build_wheel.sh python "${{ needs.plan.outputs.planex2d }}" "$VERSION" "$BUILD" "$KEEP" "$PREVIOUS" "$WINDOW_VERSIONS"
          mkdir -p wheelhouse && cp dist/*.whl wheelhouse/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  test:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
        os: [linux, macos-arm64, macos-x86_64, windows]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os == 'macos-arm64' && 'macos-15' || matrix.os == 'macos-x86_64' && 'macos-15-intel' || 'windows-latest' }}
    env:
      NEWEST: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].newest }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: core-sdist
      - uses: actions/checkout@v4
        with:
          path: occ
      - name: planex2d's sdist checked
        shell: bash
        run: python occ/tools/sdist.py "${{ needs.plan.outputs.planex2d }}" "$INDEX_SIMPLE" core-sdist
      # with the optional packages; not NGSolve, which pins netgen-mesher to its own version (its tests skip)
      - name: The current planex2d (its sdist from the index), the newest netgen of this kind, this wheel, the optional packages
        shell: bash
        run: |
          # the core's wheel from the index, as users get it; its sdist where the index has no wheel for this platform
          if python -m pip download --only-binary :all: --no-deps -d core-wheel --index-url "$INDEX_SIMPLE" \
              "planex2d==${{ needs.plan.outputs.planex2d }}"; then
            python -m pip install core-wheel/*.whl
          else
            python -m pip install core-sdist/*.tar.gz
          fi
          python -m pip install "netgen-mesher==$NEWEST" wheelhouse/*.whl pytest hypothesis \
            numpy scipy shapely ezdxf matplotlib plotly svgelements
          python -c "import planex as px; assert px._occ.loaded, px._occ.why; print('planex', px._planex._version, 'with OCC')"
      - name: planex2d's tests (its sdist's)
        shell: bash
        run: |
          mkdir src && tar xzf core-sdist/*.tar.gz -C src --strip-components=1
          cd src && python -m pytest tests -q -p no:cacheprovider --tb=short

  test-each-netgen:
    # every module built in this run with its own netgen, on one platform and Python, without the optional packages
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.each) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.kind }}-linux-3.12
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: core-sdist
      - uses: actions/checkout@v4
        with:
          path: occ
      - name: planex2d's sdist checked
        shell: bash
        run: python occ/tools/sdist.py "${{ needs.plan.outputs.planex2d }}" "$INDEX_SIMPLE" core-sdist
      - shell: bash
        run: |
          if python -m pip download --only-binary :all: --no-deps -d core-wheel --index-url "$INDEX_SIMPLE" \
              "planex2d==${{ needs.plan.outputs.planex2d }}"; then
            python -m pip install core-wheel/*.whl
          else
            python -m pip install core-sdist/*.tar.gz
          fi
          python -m pip install "netgen-mesher==${{ matrix.netgen }}" wheelhouse/*.whl pytest hypothesis
          python -c "import planex as px; assert px._occ.loaded, px._occ.why"
          mkdir src && tar xzf core-sdist/*.tar.gz -C src --strip-components=1
          cd src && python -m pytest tests -q -p no:cacheprovider --tb=short

  publish:
    needs: [plan, test, test-each-netgen]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # after the upload, so that a failed upload leaves no tag
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
    env:
      VERSION: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].version }}
      WINDOW_VERSIONS: ${{ fromJSON(needs.plan.outputs.plans)[matrix.kind].window }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ matrix.kind }}-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          notes="For planex2d ${{ needs.plan.outputs.planex2d }}, with modules for netgen-mesher $WINDOW_VERSIONS."
          if [ "${{ matrix.kind }}" = "pre" ]; then
            flag="--prerelease"
            notes="$notes For netgen's nightlies: pip install --pre planex2d[occ]."
          fi
          gh release create "v$VERSION" dist/*.whl --repo "$GITHUB_REPOSITORY" $flag \
            --target "$GITHUB_SHA" --title "planex2d-occ $VERSION" --notes "$notes"
